# Diagnostic example only: choose limits per application before adopting.
# Include AFTER @crs-setup.conf.example and BEFORE @owasp_crs/**.conf.
# DetectionOnly logs these matches but does not reject or save evaluation CPU.
# ARGS_COMBINED_SIZE counts names + values of GET/POST arguments, not file data.
SecRule ARGS_COMBINED_SIZE "@gt 65536" \
    "id:100102,phase:2,t:none,deny,status:413,log,msg:'Diagnostic total argument limit exceeded'"
# t:length measures parsed value/name bytes, including UTF-8 bytes.
SecRule ARGS|ARGS_NAMES "@gt 16384" \
    "id:100101,phase:2,t:none,t:length,deny,status:413,log,msg:'Diagnostic single argument limit exceeded'"
