# Coraza-specific expectations follow the v3.8.1 upstream harness:
# https://github.com/corazawaf/coraza/blob/v3.8.1/testing/coreruleset/.ftw-overrides.yml
# Protocol expectations additionally assert actual Go net/http rejection rather
# than ignoring these cases. No test is skipped or forced to pass here.
version: "v0.0.0"
meta:
  engine: coraza
  platform: go-http-wasm
  annotations:
    - purpose: Assert equivalent detection or HTTP-parser rejection on Go

test_overrides:
  - rule_id: 920274
    test_ids: [1]
    reason: DetectionOnly must log invalid Host; Apache's HTTP 400 is not generated by Go.
    output:
      status: 200
      log:
        expect_ids: [920274]
  - rule_id: 920280
    test_ids: [3]
    reason: Go rejects HTTP/0.9 before the WAF with HTTP 505.
    output:
      status: 505
      log:
        no_expect_ids: [920280]
  - rule_id: 920430
    test_ids: [3, 9]
    reason: Go rejects HTTP/0.9 and HTTP/0.8 before the WAF with HTTP 505.
    output:
      status: 505
      log:
        no_expect_ids: [920430]
  - rule_id: 920430
    test_ids: [5]
    reason: Go rejects the missing protocol version with a valid HTTP 400 response, not an EOF.
    output:
      status: 400
      expect_error: false
      log:
        no_expect_ids: [920430]
  - rule_id: 922130
    test_ids: [1, 2, 7]
    reason: Go multipart parser flags REQBODY_ERROR and MULTIPART_STRICT_ERROR before CRS 922130.
    output:
      log:
        expect_ids: [200002, 200003]
