name: CI

on:
  push:
    branches:
      - main
    tags:
      - "*"
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "LICENSE"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - uses: jdx/mise-action@v3

      - name: Build wasm binary
        id: wasm
        run: go run mage.go build

      - name: Run tests
        run: go run mage.go test

      - name: Run E2E tests
        if: ${{ !cancelled() && steps.wasm.outcome == 'success' }}
        run: go run mage.go e2e

      - name: Run FTW tests
        if: ${{ !cancelled() && steps.wasm.outcome == 'success' }}
        timeout-minutes: 20
        run: go run mage.go ftw

      - name: Save WASM artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coraza-http-wasm
          path: build/coraza-http-wasm.wasm

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: coraza-http-wasm
          path: build
      - name: Package draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${GITHUB_REF_NAME}"
          cd build
          sha256sum coraza-http-wasm.wasm > SHA256SUMS
          zip "coraza-http-wasm-${tag}.zip" coraza-http-wasm.wasm
          gh release create "$tag" --draft --title "$tag" "coraza-http-wasm-${tag}.zip" coraza-http-wasm.wasm SHA256SUMS
